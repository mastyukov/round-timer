<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="round-timer-version" content="v0.8.17">
  <meta name="theme-color" content="#08130d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Раунд таймер">
  <meta name="description" content="Спортивный интервальный таймер с крупными цифрами и точным обратным отсчётом.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="privacy-policy" href="./privacy.html">
  <link rel="icon" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Раунд таймер</title>
</head>
<body class="phase-idle">
  <div id="settingsBackdrop" class="settings-backdrop" aria-hidden="true"></div>
  <div class="app-shell">
    <main>
      <section class="scoreboard" aria-label="Текущая тренировка">
        <p class="round-line" id="roundLabel"><span class="round-word">РАУНД</span><span class="round-count" id="roundCount" role="text" aria-label="Раунд 1/3"><span class="round-number" id="roundCurrent">1</span><span class="round-slash" aria-hidden="true"></span><span class="round-number" id="roundTotal">3</span></span></p>
        <div class="clock-frame"><div id="clock" class="clock" role="timer" aria-live="off">01:00</div></div>
        <div class="phase-line" id="phaseLabel">ГОТОВ К СТАРТУ</div>
        <div class="progress-track" aria-hidden="true"><div id="progressBar" class="progress-fill"></div></div>
      </section>
      <div class="bottom-actions"><section id="controls" class="controls" aria-label="Управление">
        <button id="startPauseButton" class="main-button" type="button">▶ СТАРТ</button>
        <button id="resetButton" class="secondary-button" type="button">СБРОС</button>
      </section>
      <button id="audioRecoveryButton" class="audio-recovery" type="button" hidden>🔊 ВКЛЮЧИТЬ ЗВУК</button>
      <details id="settings" class="settings">
        <summary>НАСТРОЙКИ ТРЕНИРОВКИ <span class="chevron">⌄</span></summary>
        <form id="settingsForm" class="settings-form">
          <label>Время раунда <select id="workInput"></select></label>
          <label>Время отдыха <select id="restInput"></select></label>
          <label>Количество раундов <select id="roundsInput"></select></label>
          <label>Подготовка <select id="prepareInput"></select></label>
          <button type="button" id="closeSettingsButton" class="close-settings">✓ ГОТОВО · ВЕРНУТЬСЯ К ТАЙМЕРУ</button>
          <small class="preview-version" aria-label="Версия таймера">ВЕРСИЯ · v0.8.17</small>
        </form>
      </details></div>
    </main>
  </div>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
