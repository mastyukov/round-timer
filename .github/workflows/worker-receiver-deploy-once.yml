name: Deploy isolated Round Timer error receiver (owner approved)
on:
  push:
    branches: [setup/fast-lane-v1.3]
    paths:
      - '.github/workflows/worker-receiver-deploy-once.yml'

permissions:
  contents: read

concurrency:
  group: round-timer-error-receiver-deployment
  cancel-in-progress: false

jobs:
  deploy-and-test:
    if: ${{ github.repository == 'mastyukov/round-timer' && github.event.head_commit.message == 'Owner-approved standalone diagnostic Worker deploy and synthetic tests' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_API_TOKEN }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Verify tests before Worker deployment (never deploy PWA)
        run: |
          set -euo pipefail
          node --check receiver/cloudflare-worker/src/index.mjs
          node --test tests/*.test.mjs
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('receiver/cloudflare-worker/wrangler.jsonc','utf8'));if(c.name!=='round-timer-error-receiver'||c.observability?.enabled!==false||c.analytics_engine_datasets?.[0]?.binding!=='ERROR_EVENTS'||c.analytics_engine_datasets?.[0]?.dataset!=='round_timer_error_events')process.exit(1);console.log('PASS: exact Worker name, dataset and privacy configuration')"
      - name: Resolve one account automatically (never print token or ID)
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::Worker token missing"; exit 1; }
          temp="$(mktemp)"
          trap 'rm -f "$temp"' EXIT
          code="$(curl --silent --show-error --connect-timeout 15 --max-time 30 \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --output "$temp" --write-out '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts?per_page=100")"
          python3 - "$temp" "$code" "$GITHUB_ENV" <<'PY'
          import json,sys
          from pathlib import Path
          try: obj=json.loads(Path(sys.argv[1]).read_text())
          except Exception: raise SystemExit('Invalid Cloudflare response')
          accounts=obj.get('result') or []
          if sys.argv[2]!='200' or not obj.get('success') or len(accounts)!=1:
              raise SystemExit('Exactly one accessible Cloudflare account is required')
          account_id=accounts[0].get('id','')
          if len(account_id)!=32 or any(c not in '0123456789abcdefABCDEF' for c in account_id):
              raise SystemExit('Unexpected Cloudflare account identifier')
          with open(sys.argv[3],'a') as f: f.write('CLOUDFLARE_ACCOUNT_ID='+account_id+'\n')
          print('PASS: correct Cloudflare account resolved; identifier hidden')
          PY
      - name: Deploy standalone receiver to existing Worker (does not touch Pages)
        working-directory: receiver/cloudflare-worker
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
      - name: Test synthetic input, wrong origin, and forbidden analytics
        shell: bash
        run: |
          set -euo pipefail
          url="https://round-timer-error-receiver.mastyukov.workers.dev"
          endpoint="$url/v1/error"
          probe() {
            local name="$1" expected="$2"; shift 2
            local actual
            actual="$(curl --silent --show-error --connect-timeout 15 --max-time 30 \
              --output /dev/null --write-out '%{http_code}' "$@")"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::$name expected HTTP $expected, received $actual"
              exit 1
            fi
            echo "PASS: $name returned HTTP $actual"
          }
          probe 'Synthetic technical error accepted (not yet proof of storage)' 204 \
            -X POST -H 'Origin: https://mastyukov.github.io' \
            -H 'Content-Type: text/plain;charset=UTF-8' \
            --data '{"event":"app_error","code":"UNHANDLED_ERROR","component":"ui","version":"0.8.3"}' \
            "$endpoint"
          probe 'Unapproved origin rejected' 403 \
            -X POST -H 'Origin: https://untrusted.example' \
            -H 'Content-Type: text/plain;charset=UTF-8' \
            --data '{"event":"app_error","code":"UNHANDLED_ERROR","component":"ui","version":"0.8.3"}' \
            "$endpoint"
          probe 'Workout tracking rejected' 400 \
            -X POST -H 'Origin: https://mastyukov.github.io' \
            -H 'Content-Type: text/plain;charset=UTF-8' \
            --data '{"event":"workout_start","code":"UNKNOWN","component":"other","version":"0.8.3"}' \
            "$endpoint"
          probe 'No public statistics endpoint' 404 "$url/"
          echo 'SAFE: PWA not deployed; receiver only. No personal data used.'
