name: Publish approved Round Timer FINAL v0.8.20.16 to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tests/final-v082016.test.mjs'
      - '.github/workflows/publish-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: round-timer-production-pages
  cancel-in-progress: false

jobs:
  verify:
    name: Verify FINAL v0.8.20.16 exact assets and source
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Validate public artifact scope and syntax
        run: |
          set -euo pipefail
          test -s site/index.html
          test -s site/sw.js
          test -f site/.nojekyll
          test -s site/privacy.html
          test ! -d site/tests
          test ! -d site/qa
          test ! -d site/receiver
          test ! -d site/project
          for f in site/*.mjs site/diagnostics/*.mjs site/sw.js; do node --check "$f"; done
      - name: Verify pinned 0.8.20.16 timer, ambient/Prewarm, offline, visuals and all original sound hashes
        run: |
          set -euo pipefail
          node --test tests/final-v082016.test.mjs tests/timer-model.test.mjs tests/diagnostic-schema.test.mjs tests/diagnostics-sender.test.mjs

  deploy:
    name: Deploy production site/ ONLY after exact QA PASS
    if: ${{ github.ref == 'refs/heads/main' && github.repository == 'mastyukov/round-timer' }}
    needs: [verify]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload only site/ as public artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy approved assets
        id: deployment
        uses: actions/deploy-pages@v4
