name: Round Timer — monitoring self-health alert (proposed, not enabled)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/monitor-health-alert.yml'
  workflow_run:
    workflows:
      - 'Round Timer — diagnostic monitor every three days'
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  validate:
    if: github.event_name == 'pull_request'
    name: No-credentials dry inspection only
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check no production/API secrets, no deployment commands
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/monitor-health-alert.yml').read_text()
          assert "workflow_run:" in p and "pull_request:" in p
          assert "github.event.workflow_run.conclusion == 'failure'" in p
          assert "github.event.workflow_run.event == 'schedule'" in p
          assert "actions/deploy-pages" not in p
          assert "OPENAI_API_KEY" not in p
          print('SELF-HEALTH NOTIFICATION DRY RUN: PASS (no issue created)')
          PY

  alert:
    # Only a scheduled failure of the main-branch monitor can alert.
    # Never trust PR-controlled code or workflow-run artifacts.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'schedule' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == 'mastyukov/round-timer'
    name: Notify owner once per failed monitor run
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Open or append a single persistent monitoring-health Issue
        uses: actions/github-script@v7
        with:
          script: |
            const repo={owner:'mastyukov',repo:'round-timer'};
            const run=context.payload.workflow_run;
            const label='round-timer-monitor-health';
            const anchor='<!-- round-timer-monitor-health-v1 -->';
            const runMarker='MONITOR_RUN_ID:'+String(run.id);
            const subject='[Round Timer] Сбой автоматической проверки ошибок';
            const lines=[
              '@mastyukov-cyber',
              '',
              'Автоматическая проверка ошибок Round Timer **завершилась сбоем**.',
              'Из-за этого неизвестно, имеются ли новые пользовательские ошибки.',
              'Не считайте отсутствие GitHub Issues подтверждением исправной работы.',
              '',
              'GitHub Actions: '+run.html_url,
              runMarker,
              '',
              'Проверьте секрет доступа Cloudflare, ограничения API и журналы CI.',
              'Рабочее приложение не изменялось.',
            ];
            try{
              await github.rest.issues.getLabel({...repo,name:label});
            }catch(err){
              if(err.status!==404)throw err;
              await github.rest.issues.createLabel({...repo,name:label,color:'f5a623',
                description:'Control-system failure, not a user diagnostic event'});
            }
            const found=await github.paginate(github.rest.issues.listForRepo,{
              ...repo,state:'open',labels:label,per_page:100
            });
            const issue=found.find(i=>!i.pull_request && (i.body||'').includes(anchor));
            if(issue){
              if((issue.body||'').includes(runMarker))return;
              const comments=await github.paginate(github.rest.issues.listComments,{
                ...repo,issue_number:issue.number,per_page:100
              });
              if(comments.some(c=>(c.body||'').includes(runMarker)))return;
              await github.rest.issues.createComment({...repo,issue_number:issue.number,
                body:lines.join('\n')});
            }else{
              await github.rest.issues.create({...repo,title:subject,
                labels:[label],body:[anchor,...lines].join('\n')});
            }
