name: Check Analytics Engine delivery (read-only; no user data output)
on:
  push:
    branches: [setup/fast-lane-v1.3]
    paths:
      - '.github/workflows/verify-analytics-storage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_API_TOKEN }}
    steps:
      - name: Probe aggregate read access only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          temp="$(mktemp)"
          result="$(mktemp)"
          trap 'rm -f "$temp" "$result"' EXIT
          accounts_status="$(curl --silent --show-error --max-time 30 --output "$temp" --write-out '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            'https://api.cloudflare.com/client/v4/accounts?per_page=100')"
          if [[ "$accounts_status" != 200 ]]; then
            echo "::error::Could not discover account"
            exit 1
          fi
          account_id="$(python3 - "$temp" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          y=x.get('result') or []
          if len(y)!=1: raise SystemExit('Expected one accessible account')
          print(y[0]['id'])
          PY
          )"
          query="SELECT COUNT() AS received FROM round_timer_error_events WHERE timestamp > NOW() - INTERVAL '24' HOUR AND blob1 = 'app_error' AND blob2 = 'UNKNOWN' AND blob4 = '0.8.5' FORMAT JSON"
          sql_status="$(curl --silent --show-error --max-time 30 --output "$result" --write-out '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --data "$query" \
            "https://api.cloudflare.com/client/v4/accounts/$account_id/analytics_engine/sql")"
          if [[ "$sql_status" != 200 ]]; then
            echo "SQL read: unavailable (HTTP $sql_status). Could not confirm test event; check Cloudflare account permissions."
            exit 0
          fi
          python3 - "$result" <<'PY'
          import json,sys
          try:
              data=json.load(open(sys.argv[1]))
              items=data.get('data',[])
              count=sum(int(r.get('received',0)) for r in items)
              print(f"Test iPhone signal count (v0.8.5, last 24h): {count} (aggregated read-only)")
          except Exception:
              print('SQL responded HTTP 200, but returned unexpected format; no personal records logged')
          PY
