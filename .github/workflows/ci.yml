name: FAST LANE CI — Round Timer FINAL v0.8.20.19 (checks only)
on:
  push:
    branches:
      - main
      - 'assistant/round-timer/**'
    paths:
      - 'site/**'
      - 'tests/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/publish-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release syntax and frozen public scope
        run: |
          set -euo pipefail
          for f in site/*.mjs site/diagnostics/*.mjs site/sw.js; do node --check "$f"; done
          test -f site/.nojekyll
          test ! -d site/qa
          test ! -d site/tests
          test ! -d site/project
          test ! -d site/receiver
      - name: Final exact release, audio bytes, offline graph and timer model
        run: |
          set -euo pipefail
          node --test tests/final-v082016.test.mjs tests/timer-model.test.mjs tests/diagnostic-schema.test.mjs tests/diagnostics-sender.test.mjs
      - name: Keep safe Python diagnostics regression
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
